version: 2

models:
  - name: odd_bet
    description: >
      SCD2 table with one row per bet snapshot. Unions two sources: src.the_odds_api
      (ML, spread, and totals from bookmakers like DraftKings) and src.kalshi_game
      (prediction market ML offers, home and away side each as a separate row).
      Kalshi prices are converted from decimal probability to decimal odds (1 / yes_price).
      team_id is null for totals bets. start_ts/end_ts are dbt-managed via LEAD window;
      active = (end_ts IS NULL).
    columns:
      - name: bet_hash
        description: "md5(bookmaker || game_id || coalesce(team_id,'total') || bet_type) — logical bet identifier, not unique across SCD2 history"
        tests: [not_null]
      - name: bet_source_id
        description: "odd_hash from src.the_odds_api or kalshi_hash from src.kalshi_game"
        tests: [not_null]
      - name: bookmaker
        description: "Sportsbook or platform name (e.g. 'DraftKings', 'Kalshi')"
        tests: [not_null]
      - name: game_id
        description: "Foreign key to ball.game (source_game_id)"
        tests: [not_null]
      - name: team_id
        description: "Foreign key to ball.team. NULL for totals bets (OVER/UNDER)."
      - name: bet_type
        description: "ML (moneyline), SPR (spread), OVER, or UNDER"
        tests: [not_null]
      - name: bet_concat
        description: "Human-readable identifier. Non-totals include team abbr, e.g. CFB_MRSH_ODU_20251011_ML_ODU. Totals omit team, e.g. CFB_MRSH_ODU_20251011_OVER."
      - name: price
        description: "Decimal odds. For the_odds_api, sourced directly. For Kalshi, computed as 1 / yes_price."
      - name: points
        description: "Spread or total point value. NULL for ML and Kalshi bets."
      - name: active
        description: "True when end_ts IS NULL (current snapshot). Derived — no external updates needed."
        tests: [not_null]
      - name: start_ts
        description: "markets_last_update_ts for the_odds_api rows; insert_ts for Kalshi rows."
        tests: [not_null]
      - name: end_ts
        description: "Timestamp when this snapshot was superseded by the next pull; NULL for the current active row. Managed by dbt via LEAD window function."

  - name: odd_v_parlay
    description: >
      View with one row per parlay leg. Joins odd.parlay → odd.leg → odd_bet → mart_game
      so all bet and game context is pre-resolved. Consumed by v_txn.
    columns:
      - name: parlay_id
        description: "Foreign key to odd.parlay"
        tests: [not_null]
      - name: price_mult
        description: "Combined price multiplier for the parlay (product of all leg prices)"
      - name: bet_hash
        description: "Leg's bet_hash linking to odd.bet"
      - name: leg_price
        description: "Price for this individual leg at time of placement"
      - name: game_id
        description: "Game this leg is on"
      - name: bookmaker
        description: "Sportsbook for this leg"
      - name: bet_type
        description: "ML, SPR, OVER, or UNDER"
      - name: bet_concat
        description: "Human-readable bet identifier"
      - name: points
        description: "Spread or total value; null for moneylines"
      - name: home
        description: "Home team abbreviation"
      - name: away
        description: "Away team abbreviation"
      - name: game_time
        description: "Scheduled tip/kick-off time"

  - name: odd_v_txn
    description: >
      View over odd.txn with bet and game context joined in. Straight bets produce one row per txn;
      parlay bets produce one row per leg. Columns are unified via COALESCE so callers get a
      consistent shape. txn_type distinguishes 'straight' vs 'parlay'.
    columns:
      - name: txn_id
        description: "Primary key of odd.txn"
        tests: [not_null]
      - name: txn_type
        description: "'straight' when bet_hash is set on txn; 'parlay' when parlay_id is set"
        tests: [not_null]
      - name: bet_hash
        description: "Resolved bet_hash: txn.bet_hash for straight bets, leg.bet_hash for parlay legs"
      - name: price
        description: "Resolved price: odd_bet.price for straight bets, leg.price for parlay legs"
      - name: game_dt
        description: "Game date stored on the txn — used to determine active vs complete"
      - name: bookmaker
        description: "Sportsbook (straight) or leg bookmaker (parlay)"
      - name: bet_type
        description: "ML, SPR, OVER, or UNDER"
      - name: bet_concat
        description: "Human-readable bet identifier"
      - name: parlay_id
        description: "null for straight bets"
      - name: parlay_price_mult
        description: "Combined parlay multiplier; null for straight bets"
      - name: game_id
        description: "Game the bet is on"
      - name: home
        description: "Home team abbreviation"
      - name: away
        description: "Away team abbreviation"
      - name: game_time
        description: "Scheduled tip/kick-off time"

  - name: odd_v_enhanced
    description: >
      Aggregate view over odd.enhanced, summed by bettor/syndicate/runner/team/enhancement_type/name
      so multiple team-attribute enhancements chosen for the same team collapse into one level.
      Left joins mart_team on team_id (team_id = 0 is the "no team" sentinel used by non-team
      enhancements and is excluded from the join) and joins odd.enhancement for the name.
    columns:
      - name: bettor_id
        description: "Foreign key to odd.bettor"
        tests: [not_null]
      - name: syndicate_id
        description: "Foreign key to odd.syndicate"
        tests: [not_null]
      - name: runner_id
        description: "Foreign key to odd.runner"
      - name: team_id
        description: "Foreign key to mart.team; 0 means no team (non-team enhancement)"
        tests: [not_null]
      - name: enhancement_type
        description: "clv | team | edge"
        tests: [not_null]
      - name: edge_type
        description: "price | unit | clv | team | balance | trigger | risk"
        tests: [not_null]
      - name: name
        description: "Team abbreviation for team-type enhancements, else the odd.enhancement name (e.g. ML/SPR/O/U for clv)"
        tests: [not_null]
      - name: league_id
        description: "Foreign key to mart.league via team_id; NULL for non-team enhancements"
      - name: level
        description: "Sum of levels across all enhancements matching this bettor/syndicate/runner/team/type/name"
        tests: [not_null]

  - name: odd_enhance_options
    description: >
      Table with one row per runner × available enhancement. Edge-type enhancements are
      capped to 3 random picks per runner; clv-type enhancements are never capped. Carries
      only identifying columns — display attributes (name, description, symbol, edge_type,
      rarity, cost, effect, value, config) live on odd.enhancement and are joined in by
      odd_v_enhance_options rather than duplicated here. option_hash is
      md5(runner_id || enhancement_id || league_id || available_attr_value) and must be
      submitted with the selection to prevent reuse.
    columns:
      - name: runner_id
        description: "Foreign key to odd.runner"
        tests: [not_null]
      - name: bettor_id
        description: "Foreign key to odd.bettor"
        tests: [not_null]
      - name: syndicate_id
        description: "Foreign key to odd.syndicate"
        tests: [not_null]
      - name: enhancement_id
        description: "Foreign key to odd.enhancement"
        tests: [not_null]
      - name: enhancement_type
        description: "'clv', 'edge', or 'team'"
      - name: league_id
        description: "League the available_attr_value belongs to (team-type enhancements only; NULL otherwise)"
      - name: available_attr_value
        description: "For team-type enhancements: the randomly-picked attribute value (e.g. a region or conference) available within league_id. NULL for non-team enhancements."
      - name: option_hash
        description: "md5(runner_id || enhancement_id || league_id || available_attr_value) — submit with selection to validate and prevent reuse"

  - name: odd_v_enhance_options
    description: >
      View over odd_enhance_options, joined to odd.enhancement for all display attributes,
      anti-joined against odd.enhanced (on option_hash, active = true) to exclude options
      the runner has already chosen. This is what the API's enhance-options endpoint reads.
    columns:
      - name: runner_id
        description: "Foreign key to odd.runner"
        tests: [not_null]
      - name: bettor_id
        description: "Foreign key to odd.bettor"
        tests: [not_null]
      - name: syndicate_id
        description: "Foreign key to odd.syndicate"
        tests: [not_null]
      - name: enhancement_id
        description: "Foreign key to odd.enhancement"
        tests: [not_null]
      - name: enhancement_type
        description: "'clv', 'edge', or 'team' — from odd.enhancement"
      - name: edge_type
        description: "'price', 'unit', 'clv', 'team', 'balance', 'trigger', or 'risk' — from odd.enhancement"
      - name: name
        description: "Display name of the enhancement"
      - name: description
        description: "Description of what the enhancement does"
      - name: bet_type
        description: "For clv enhancements: 'h2h', 'spread', or 'total'. NULL for edge/team."
      - name: rarity
        description: "'dollar', 'nickel', 'dime', or 'whale'. Edge-only, NULL for clv/team."
      - name: cost
        description: "Base cost tier: 1 (dollar), 2 (nickel), 3 (dime), or 5 (whale). Syndicate admins may apply a 2x/3x/4x multiplier on top. NULL for clv/team."
      - name: effect
        description: "The mechanic this edge applies, e.g. odds_add, odds_mult, stake_add, units_add, payout_mult, grant_clv, clv_duplicate, interest, refund_pct, retrigger, copy_left"
      - name: value
        description: "Magnitude of `effect`"
      - name: config
        description: "Bespoke per-edge parameters not shared across enough rows to deserve a column: scope, condition, scaling, penalty, constraint, min_odds, max_odds, threshold, min_units, require_same_color, etc."
      - name: symbol
        description: "SF Symbol name for display"
      - name: league_id
        description: "League the available_attr_value belongs to (team-type enhancements only; NULL otherwise)"
      - name: available_attr_value
        description: "For team-type enhancements: the randomly-picked attribute value (e.g. a region or conference) available within league_id. NULL for non-team enhancements."
      - name: option_hash
        description: "md5(runner_id || enhancement_id || league_id || available_attr_value) — submit with selection to validate and prevent reuse"
