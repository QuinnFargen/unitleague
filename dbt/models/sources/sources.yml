version: 2

sources:
  - name: src
    schema: src
    description: "Cleaned ESPN ingest tables loaded by Python/Kestra ETL pipeline"
    tables:
      - name: espn_schedule
        description: "One row per game from ESPN. Includes scores, period breakdowns, and team IDs."
        columns:
          - name: game_id
            tests: [not_null]
          - name: league_id
            tests: [not_null]
          - name: gamedate
            tests: [not_null]

      - name: espn_week
        description: "Week boundary definitions per league and year from ESPN."
        columns:
          - name: league_id
            tests: [not_null]
          - name: yr
            tests: [not_null]
          - name: week_start_dt
            tests: [not_null]
          - name: week_end_dt
            tests: [not_null]

      - name: the_odds_api
        description: "One row per outcome per market per bookmaker per game from TheOddsAPI."
        columns:
          - name: odd_hash
            tests: [not_null, unique]
          - name: id
            tests: [not_null]

      - name: kalshi_game
        description: "Raw Kalshi game snapshots. One row per pull per game."
        columns:
          - name: kalshi_hash
            tests: [not_null, unique]

  - name: odd
    schema: odd
    description: "Syndicate, bettors and what bet are created are stored here"
    tables:
      - name: syndicate
        description: "One row per syndicate. Which bettors are connected to syndicates in the Runner table"

      - name: txn
        description: "One row per bet or parlay transaction placed by a bettor. bet_hash xor parlay_id is non-null."
        columns:
          - name: txn_id
            tests: [not_null, unique]
          - name: bettor_id
            tests: [not_null]
          - name: syndicate_id
            tests: [not_null]

      - name: enhanced
        description: "Applied enhancement rows — one per bettor/syndicate/enhancement/team/week combo."
        columns:
          - name: enhanced_id
            tests: [not_null, unique]
          - name: bettor_id
            tests: [not_null]
          - name: syndicate_id
            tests: [not_null]
          - name: enhancement_id
            tests: [not_null]

      - name: enhancement
        description: "Enhancement definitions with config jsonb holding price_mult and unit_mult."
        columns:
          - name: enhancement_id
            tests: [not_null, unique]
          - name: enhancement_type
            tests: [not_null]

      - name: parlay
        description: "One row per parlay. price_mult is the product of all leg prices."

      - name: leg
        description: "One row per leg within a parlay. bet_hash links to odd.bet."

      - name: txn_type
        description: "Lookup table for transaction types: 1=straight, 2=parlay, 3=unit."
        columns:
          - name: txn_type_id
            tests: [not_null, unique]

      - name: runner
        description: "One row per bettor/syndicate pairing. Active runners are eligible for enhancements."
        columns:
          - name: runner_id
            tests: [not_null, unique]
          - name: bettor_id
            tests: [not_null]
          - name: syndicate_id
            tests: [not_null]

      - name: bettor
        description: "One row per registered bettor, keyed by their Apple sign-in subject."
        columns:
          - name: bettor_id
            tests: [not_null, unique]