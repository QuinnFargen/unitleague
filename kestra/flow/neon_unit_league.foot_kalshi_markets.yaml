id: foot_kalshi_markets
namespace: neon_unit_league

tasks:
  - id: fetch_event_cfb
    type: io.kestra.plugin.jdbc.postgresql.Query
    sql: |      
      select s.source_game_id as event_id
      from ball.game s 
      where s.league_id = 5 -- CFB
        and s.won_team_id is null
        and s.game_dt < CURRENT_DATE + 7
        and s.game_dt > '2025-07-01' 
      order by s.game_dt;
    fetchType: STORE

  - id: cfb_csv_event
    type: "io.kestra.plugin.serdes.csv.IonToCsv"
    from: "{{ outputs.fetch_event_cfb.uri }}"

  - id: fetch_event_nfl
    type: io.kestra.plugin.jdbc.postgresql.Query
    sql: |      
      select s.source_game_id as event_id
      from ball.game s 
      where s.league_id = 2 -- NFL
        and s.won_team_id is null
        and s.game_dt < CURRENT_DATE + 7
        and s.game_dt > '2025-07-01'
      order by s.game_dt;
    fetchType: STORE

  - id: nfl_csv_event
    type: "io.kestra.plugin.serdes.csv.IonToCsv"
    from: "{{ outputs.fetch_event_nfl.uri }}"



  - id: if_nfl
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs['fetch_event_nfl'].size > 0 }}"
    then:
    - id: python_nfl_api
      type: io.kestra.plugin.scripts.python.Script
      outputFiles:
        - "nfl_predict.csv"
      beforeCommands:
        - pip install pandas
        - pip install requests
      inputFiles:
        input.csv: "{{outputs.nfl_csv_event.uri}}"
      warningOnStdErr: false
      script: | 
        import pandas as pd
        import requests

        def get_all_markets(series_ticker):
            """Fetch all markets for a series, handling pagination"""
            all_markets = []
            cursor = None
            base_url = "https://api.elections.kalshi.com/trade-api/v2/markets"
            # Get just the 10 most recent markets

            while True:
                # Build URL with cursor if we have one
                url = f"{base_url}?series_ticker={series_ticker}&limit=100&status=open"
                if cursor:
                    url += f"&cursor={cursor}"

                response = requests.get(url)
                data = response.json()

                # Add markets from this page
                all_markets.extend(data['markets'])

                # Check if there are more pages
                cursor = data.get('cursor')
                if not cursor:
                    break

            return all_markets

        # Example usage
        markets = get_all_markets("KXNFLGAME")

        rows = []
        for m in markets:
            rows.append({
                "event_ticker": m.get("event_ticker"),
                "ticker": m.get("ticker"),
                "expected_expiration_time": m.get("expected_expiration_time"),
                "title": m.get("title"),
                "yes_sub_title": m.get("yes_sub_title"),
                "volume": m.get("volume"),
                "volume_24h": m.get("volume_24h"),
                "yes_ask": m.get("yes_ask"),
                "yes_bid": m.get("yes_bid"),
                "liquidity": m.get("liquidity"),
                "open_interest": m.get("open_interest"),
                "rules_primary": m.get("rules_primary"),
                "status": m.get("status"),
            })

        # Convert to DataFrame
        nfl_df = pd.DataFrame(rows)
        nfl_df.to_csv("nfl_predict.csv", index=False)

    - id: pg_copyin_stg_kalshi_nfl
      type: io.kestra.plugin.jdbc.postgresql.CopyIn
      format: CSV
      from: "{{ outputs.python_nfl_api.outputFiles['nfl_predict.csv'] }}"
      table: api.stg_kalshi_markets  # Lowercase in DB
      header: true
      delimiter: ","




  - id: if_cfb
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs['fetch_event_cfb'].size > 0 }}"
    then:
    - id: python_cfb_api
      type: io.kestra.plugin.scripts.python.Script
      outputFiles:
        - "cfb_predicts.csv"
      beforeCommands:
        - pip install pandas
        - pip install requests
      inputFiles:
        input.csv: "{{outputs.cfb_csv_event.uri}}"
      warningOnStdErr: false
      script: | 
        import pandas as pd
        import requests

        def get_all_markets(series_ticker):
            """Fetch all markets for a series, handling pagination"""
            all_markets = []
            cursor = None
            base_url = "https://api.elections.kalshi.com/trade-api/v2/markets"
            # Get just the 10 most recent markets

            while True:
                # Build URL with cursor if we have one
                url = f"{base_url}?series_ticker={series_ticker}&limit=100&status=open"
                if cursor:
                    url += f"&cursor={cursor}"

                response = requests.get(url)
                data = response.json()

                # Add markets from this page
                all_markets.extend(data['markets'])

                # Check if there are more pages
                cursor = data.get('cursor')
                if not cursor:
                    break

            return all_markets

        # Example usage
        markets = get_all_markets("KXNCAAFGAME")

        rows = []
        for m in markets:
            rows.append({
                "event_ticker": m.get("event_ticker"),
                "ticker": m.get("ticker"),
                "expected_expiration_time": m.get("expected_expiration_time"),
                "title": m.get("title"),
                "yes_sub_title": m.get("yes_sub_title"),
                "volume": m.get("volume"),
                "volume_24h": m.get("volume_24h"),
                "yes_ask": m.get("yes_ask"),
                "yes_bid": m.get("yes_bid"),
                "liquidity": m.get("liquidity"),
                "open_interest": m.get("open_interest"),
                "rules_primary": m.get("rules_primary"),
                "status": m.get("status"),
            })

        # Convert to DataFrame
        nfl_df = pd.DataFrame(rows)
        nfl_df.to_csv("cfb_predicts.csv", index=False)

    - id: pg_copyin_stg_cfb_kalshi
      type: io.kestra.plugin.jdbc.postgresql.CopyIn
      format: CSV
      from: "{{ outputs.python_cfb_api.outputFiles['cfb_predicts.csv'] }}"
      table: api.stg_kalshi_markets  # Lowercase in DB
      header: true
      delimiter: ","


  - id: if_cfb_or_nfl
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs['fetch_event_cfb'].size > 0 }} || {{ outputs['fetch_event_nfl'].size > 0 }}"
    then:
      - id: pg_exec_sp_load
        type: io.kestra.plugin.jdbc.postgresql.Query
        sql: |
          CALL "api"."sp_stg_kalshi_load_predict"();


pluginDefaults:
  - type: io.kestra.plugin.jdbc.postgresql
    values:
      url: jdbc:postgresql://{{secret('POSTGRES_NEON_HOST')}}/SPORT
      username: "{{secret('POSTGRES_NEON_USERNAME')}}"
      password: "{{secret('POSTGRES_NEON_PASSWORD')}}"

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */6 * * *"
    recoverMissedSchedules: NONE
