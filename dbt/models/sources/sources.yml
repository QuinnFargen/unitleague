version: 2

sources:
  - name: src
    schema: src
    description: "Cleaned ESPN ingest tables loaded by Python/Kestra ETL pipeline"
    tables:
      - name: espn_schedule
        description: "One row per game from ESPN. Includes scores, period breakdowns, and team IDs."
        columns:
          - name: game_id
            tests: [not_null]
          - name: league_id
            tests: [not_null]
          - name: gamedate
            tests: [not_null]

      - name: espn_week
        description: "Week boundary definitions per league and year from ESPN."
        columns:
          - name: league_id
            tests: [not_null]
          - name: yr
            tests: [not_null]
          - name: week_start_dt
            tests: [not_null]
          - name: week_end_dt
            tests: [not_null]

      - name: the_odds_api
        description: "One row per outcome per market per bookmaker per game from TheOddsAPI."
        columns:
          - name: odd_hash
            tests: [not_null, unique]
          - name: id
            tests: [not_null]

      - name: kalshi_game
        description: "One row per game from Kalshi prediction markets with pre-joined home/away team IDs and prices."
        columns:
          - name: kalshi_game_id
            tests: [not_null, unique]
          - name: game_id
            tests: [not_null]