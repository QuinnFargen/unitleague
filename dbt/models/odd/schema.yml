version: 2

models:
  - name: odd_bet
    description: >
      One row per individual bet offer. Unions two sources: src.the_odds_api
      (moneyline, spread, and totals from bookmakers like DraftKings) and
      src.kalshi_game (prediction market h2h offers, home and away side each
      as a separate row). Kalshi prices are converted from 0–100 probability
      to decimal odds (100 / yes_price). team_id is null for totals bets.
    columns:
      - name: bet_hash
        description: "md5(bookmaker || game_id || coalesce(team_id,'total') || bet_type) — deduplication key"
        tests: [not_null, unique]
      - name: bet_source_id
        description: "odd_hash from src.the_odds_api or kalshi_game_id::varchar from src.kalshi_game"
        tests: [not_null]
      - name: bookmaker
        description: "Sportsbook or platform name (e.g. 'DraftKings', 'Kalshi')"
        tests: [not_null]
      - name: game_id
        description: "Foreign key to ball.game"
        tests: [not_null]
      - name: team_id
        description: "Foreign key to ball.team. NULL for totals bets (Over/Under)."
      - name: bet_type
        description: "h2h, spreads, or totals (from the_odds_api markets_key; always h2h for Kalshi)"
        tests: [not_null]
      - name: bet_concat
        description: "Human-readable identifier, e.g. NBA_BOS_MIA_20241015_H2H"
      - name: price
        description: "Decimal odds. For the_odds_api, sourced directly. For Kalshi, computed as 100 / yes_price."
      - name: points
        description: "Spread or total point value. NULL for h2h and Kalshi bets."
      - name: active
        description: "Always true at insert time; updated externally when a bet is no longer available."
        tests: [not_null]
      - name: start_ts
        description: "markets_last_update_ts for the_odds_api rows; insert_ts for Kalshi rows."
        tests: [not_null]
      - name: end_ts
        description: "NULL at insert; populated externally when the bet expires or closes."